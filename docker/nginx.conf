# Do not hardcode "HTTPS on".
#
# TLS terminates at Cloudflare, so the origin only ever receives plain HTTP -
# but the same file also serves direct LAN access over http. Forcing HTTPS on
# unconditionally made Laravel build https URLs and secure cookies for a direct
# http visit too, which loops the browser on a scheme the server does not
# answer. Cloudflare sets X-Forwarded-Proto on every proxied request, so the
# scheme is derived from that instead: https behind the tunnel, http otherwise.
#
# This is done in nginx rather than by trusting proxies in Laravel, so it works
# with no application config: when HTTPS is "on" the request is secure, and
# these maps are the single source of that answer for both schemes.
map $http_x_forwarded_proto $tracker_https {
    default off;
    https   on;
}

map $http_x_forwarded_proto $tracker_port {
    default 80;
    https   443;
}

# Re-resolve the app container per request.
#
# `fastcgi_pass app:9000` resolves the name once, at nginx start, and caches the
# address forever. Every `docker compose up -d --build` recreates the app
# container with a new IP, so nginx keeps dialing the dead one and answers 502
# until it is restarted by hand - which is exactly what happened on the deploy
# that shipped this comment. Passing the upstream through a variable forces nginx
# to ask Docker's embedded DNS (127.0.0.11) again, so a recreate is invisible.
resolver 127.0.0.11 valid=10s ipv6=off;
set $tracker_app app:9000;

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    index index.php index.html index.htm;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $tracker_app;

        # fastcgi_params sets SERVER_PORT to the FastCGI socket's port and
        # carries no scheme, so it is included FIRST and the overrides below it
        # win - nginx honours the last value for a parameter. Written the other
        # way round (overrides, then the include) the port here was silently
        # replaced by 80 and only the scheme survived, which is why an earlier
        # hand-edit on the server was only half-effective.
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;

        fastcgi_param HTTPS $tracker_https;
        fastcgi_param SERVER_PORT $tracker_port;

        # Preserved for anything that reads the header directly rather than the
        # resolved scheme.
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}