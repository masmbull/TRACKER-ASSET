version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracker-asset-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      - APP_ENV=local
      - APP_KEY=${APP_KEY}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  postgres:
    image: postgres:16-alpine
    container_name: tracker-asset-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_DATABASE:-tracker_asset}
      - POSTGRES_USER=${DB_USERNAME:-tracker}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: tracker-asset-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: tracker-asset-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "8024:8024"
    environment:
      - MP_SMTP_ADDR=0.0.0.0
      - MP_SMTP_PORT=1025
      - MP_WEB_ADDR=0.0.0.0
      - MP_WEB_PORT=8024

  nginx:
    image: nginx:alpine
    container_name: tracker-asset-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

volumes:
  pgdata:
  redisdata:
