<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 230" role="img" aria-labelledby="title desc">
  <title id="title">TRACKER-ASSET operations overview</title>
  <desc id="desc">Animated asset, audit, fleet, and document workflow overview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101828"/><stop offset="1" stop-color="#263244"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F04438"/><stop offset="1" stop-color="#FDB022"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1100" height="230" rx="24" fill="url(#bg)"/>
  <circle cx="1010" cy="-5" r="155" fill="#F04438" opacity=".08"/>
  <circle cx="95" cy="230" r="145" fill="#FDB022" opacity=".06"/>
  <text x="58" y="77" fill="#F2F4F7" font-family="system-ui,Segoe UI,sans-serif" font-size="34" font-weight="750">One register. Clear operations.</text>
  <text x="60" y="111" fill="#B2B8C3" font-family="system-ui,Segoe UI,sans-serif" font-size="16">Inventory  ·  Audit  ·  Fleet  ·  Documents</text>
  <path d="M98 166H1000" stroke="#475467" stroke-width="2" stroke-dasharray="7 9"/>
  <path d="M98 166H1000" stroke="url(#accent)" stroke-width="2" stroke-dasharray="115 787" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="902" to="0" dur="5s" repeatCount="indefinite"/>
  </path>
  <g font-family="system-ui,Segoe UI,sans-serif" text-anchor="middle" font-size="13" font-weight="650">
    <g transform="translate(100 166)"><circle r="22" fill="#263244" stroke="#F97066" stroke-width="2"/><path d="M-8-7h16v14h-16zM-4-11h8" fill="none" stroke="#F2F4F7" stroke-width="2" stroke-linejoin="round"/><text y="45" fill="#D0D5DD">ASSET</text></g>
    <g transform="translate(400 166)"><circle r="22" fill="#263244" stroke="#FDB022" stroke-width="2"/><path d="m-9 1 6 6 12-14" fill="none" stroke="#F2F4F7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text y="45" fill="#D0D5DD">AUDIT</text></g>
    <g transform="translate(700 166)"><circle r="22" fill="#263244" stroke="#F97066" stroke-width="2"/><rect x="-10" y="-8" width="20" height="16" rx="3" fill="none" stroke="#F2F4F7" stroke-width="2"/><path d="M-6-3h12M-6 2h8" stroke="#F2F4F7" stroke-width="1.5"/><text y="45" fill="#D0D5DD">FLEET</text></g>
    <g transform="translate(1000 166)"><circle r="22" fill="#263244" stroke="#FDB022" stroke-width="2"/><path d="M-7-10h9l6 6v14H-7zM2-10v7h6M-3 2h7M-3 6h7" fill="none" stroke="#F2F4F7" stroke-width="1.7" stroke-linejoin="round"/><text y="45" fill="#D0D5DD">DOCS</text></g>
  </g>
</svg>
