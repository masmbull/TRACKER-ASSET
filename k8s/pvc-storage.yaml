# Persistent storage for uploads, generated PDFs and the agent binary.
#
# This is the single most important file in this directory and the one most
# often got wrong.
#
# The web Deployment runs TWO replicas, so this volume must be mounted
# read-write by both at once. That rules out ReadWriteOnce: with RWO the second
# pod stays stuck in ContainerCreating until the first pod is evicted, which
# means a node drain silently takes the whole site down instead of failing
# over.
#
# Check what your cluster storage class actually supports before applying:
#
#     kubectl get storageclass
#
# If it offers ReadWriteMany (NFS, CephFS, Azure Files, some vSphere CSI), use
# it. If it only offers ReadWriteOnce, set web replicas to 1 in
# deployment-web.yaml rather than letting the two replicas deadlock.
#
# Sized for what is actually stored: uploaded spreadsheets and documents,
# generated PDFs, audit exports, and the ~150 MB agent binary that the
# download route serves.
# ReadWriteOnce, because that is what this cluster actually has.
#
# Verified on the office cluster: the only storage class is
# "local-path" (rancher.io/local-path), which provisions hostPath volumes and
# supports ReadWriteOnce alone. A ReadWriteMany claim does not fail loudly - it
# sits Pending forever while the second pod waits on ContainerCreating, and the
# symptom is a site that looks deployed but serves half its requests.
#
# ReadWriteOnce is also the honest choice on a single-node cluster: a second
# replica could never be scheduled on another node anyway, so there is no
# failover to protect. See replicas in deployment-web.yaml, which is set to 1
# for the same reason.
#
# local-path keeps data on the node's own disk under
# /var/lib/rancher/k3s/storage. Consequences worth knowing:
#   - It survives pod deletion and node reboot.
#   - It does NOT survive reinstalling or wiping k3s.
#   - Backups have to be taken from the host, not from inside the cluster.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tracker-asset-storage
  labels:
    app: tracker-asset
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi