# nginx, in front of php-fpm, inside the web pod.
#
# This is the Kubernetes half of docker/nginx.conf. The compose topology runs
# nginx as its own service and reaches PHP over the network at `app:9000`; in a
# single pod there is no network hop to make, so this talks to 127.0.0.1:9000 on
# the loopback interface. The compose file's hostname would not resolve here.
#
# It exists because php-fpm does not speak HTTP. It serves the FastCGI protocol
# on port 9000, and Traefik - the only ingress controller on the office cluster
# - has no FastCGI support at all. Something has to turn an HTTP request into a
# FastCGI request, and this ConfigMap is that something.
#
# Before it existed the web pod could never become Ready: the httpGet probe on
# /up was aimed at php-fpm's port, php-fpm answered with a protocol error, the
# startup probe failed its thirty attempts, and Kubernetes killed the container
# in a loop. The same socket was the Service's target, so even a pod that had
# survived would have been proxying HTTP into it.
#
# Applied by deploy.sh before deployment-web.yaml, because a Pod that mounts a
# missing ConfigMap does not start at all.
#
# Two things about the container this runs in are worth knowing before reading
# the server block, because both are invisible from this file alone:
#
#   1. /var/www/html/public does not ship in the nginx image. A container's
#      filesystem is its own, so the compiled CSS and JS the `root` directive
#      points at have to be put there: the seed-public init container in
#      deployment-web.yaml copies that directory out of the application image
#      into an emptyDir, which the nginx container then mounts read-only over
#      the path. Take that mount away and every /build/*.css request 404s - the
#      page renders, unstyled, with no error anywhere.
#
#   2. /etc/nginx/conf.d is this ConfigMap, mounted read-only, which is why the
#      file is named default.conf: it replaces the server block the image ships
#      in that directory rather than sitting beside it. The image's entrypoint
#      tries to add an IPv6 listen line to that file, cannot write to a mounted
#      ConfigMap, logs "can not modify /etc/nginx/conf.d/default.conf (read-only
#      file system?)" and continues. That line in `kubectl logs` is expected, not
#      a fault.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tracker-asset-nginx
  labels:
    app: tracker-asset
    component: web
data:
  # Mounted at /etc/nginx/conf.d, where it replaces the image's own default
  # server - the whole directory, not just the file, so there is no leftover
  # `default.conf` advertising a root of /usr/share/nginx/html.
  default.conf: |
    server {
        # 8080, not 80.
        #
        # This container runs as uid 33 (the pod securityContext in
        # deployment-web.yaml) and binding a port below 1024 is a privilege it
        # does not need. Outside the pod the number is invisible anyway: the
        # Service reaches this by port *name*.
        listen 8080;
        server_name _;

        root /var/www/html/public;
        index index.php index.html;

        charset utf-8;

        # Static files are served straight from disk, so the directory above has
        # to exist here - see the note at the top of this file. PHP requests do
        # not depend on it: SCRIPT_FILENAME is a path handed to php-fpm, which
        # reads the file from its own copy of the same image, and both resolve to
        # the identical path (/var/www/html/public/index.php) because the
        # emptyDir is mounted at exactly the path the image uses.

        # nginx's own default is 1 MB and it rejects a larger body before PHP
        # ever runs - a 413 with no application log line to explain it. The
        # import route takes spreadsheets well past that.
        #
        # This is the setting the Ingress used to carry as an
        # nginx-ingress annotation. Traefik has no equivalent and needs none -
        # it applies no request body limit by default - so the limit that
        # actually protects the app lives here, on the component that receives
        # the upload.
        client_max_body_size 64m;

        location / {
            # The canonical Laravel rule. The fallback is an internal redirect
            # to /index.php, which then matches the PHP location below - that
            # redirect, not a file on disk, is what routes an extensionless URL
            # into the framework.
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Kubernetes probes this every 10 seconds as readiness and every 20 as
        # liveness. Serving it through PHP is the point - it is Laravel's own
        # health route (bootstrap/app.php registers `health: '/up'`), so a 200
        # proves nginx, FastCGI and the application are all working, which is
        # what Ready should mean before the Service sends real traffic - but at
        # that rate it would bury the access log, so it is not written.
        location = /up {
            access_log off;
            try_files $uri /index.php?$query_string;
        }

        location ~ \.php$ {
            # Loopback. Both containers share the pod's network namespace, so
            # php-fpm's port is local. `fastcgi_pass app:9000`, as in
            # docker/nginx.conf, would try to resolve a compose service name and
            # fail at startup with "host not found in upstream".
            fastcgi_pass 127.0.0.1:9000;

            # The one to get right. Point this at the wrong path and PHP-FPM
            # answers "File not found" while nginx logs a clean 404 and nothing
            # in the application is ever reached. $realpath_root resolves the
            # symlink so the path PHP is given is the real one, which is what
            # avoids that failure when public/ or a storage symlink is on a
            # mounted volume.
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;

            # The Excel import reads a whole workbook into memory. nginx's 60s
            # default would cut a large upload off mid-import, and the app would
            # see a request that simply stopped.
            fastcgi_read_timeout 300;
            fastcgi_send_timeout 300;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }