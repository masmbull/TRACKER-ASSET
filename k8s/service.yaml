apiVersion: v1
kind: Service
metadata:
  name: tracker-asset-web
  labels:
    app: tracker-asset
spec:
  type: ClusterIP
  selector:
    app: tracker-asset
    component: web
  ports:
    - name: http
      port: 80
      # By name, so this keeps pointing at whatever serves HTTP in the pod - and
      # that is nginx's 8080, not php-fpm's 9000. php-fpm speaks FastCGI and
      # answers an HTTP request with a protocol error, which is what made the
      # port name here actively misleading: it was called `http` and pointed at
      # a FastCGI socket.
      #
      # Names also have to be unique within a pod. php-fpm's port was renamed to
      # `fpm` for that reason - a targetPort matching two containers in the same
      # pod is ambiguous, and Kubernetes just picks one of them.
      targetPort: http