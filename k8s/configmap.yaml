# Non-secret settings. Anything that is a password, a token or the APP_KEY
# belongs in tracker-asset-secrets.yaml, not here: a ConfigMap is readable by
# anything that can list configmaps in the namespace, and people do have access
# to list them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tracker-asset-config
  labels:
    app: tracker-asset
data:
  # The address the office actually reaches this on. Used for generated links.
  app_url: "http://tracker-asset.office.local"
  # Where a scanned QR code should open.
  #
  # This is the value that stops printed labels encoding "localhost" and being
  # dead to the phone that scans them. It must be the address the FLEET can
  # reach, which is rarely the same as the internal cluster service name - a
  # phone on wifi cannot resolve tracker-asset-web.default.svc.cluster.local.
  # Set it to the office hostname or IP that the web Ingress answers on.
  asset_qr_base_url: "http://tracker-asset.office.local"

  db_host: "postgres.tracker.svc.cluster.local"
  db_port: "5432"
  db_database: "tracker_asset"