# TEMPLATE ONLY - this file holds no real values and is safe to commit.
#
# To deploy, copy it and fill in the two placeholders at the bottom:
#
#     cp k8s/secrets-template.yaml k8s/secrets.yaml
#
# `k8s/secrets.yaml` is gitignored, so the filled-in copy cannot be committed
# by accident. The template keeps a different name precisely so the two cannot
# be confused for one another.
#
# Everything here is base64-encoded, NOT encrypted. `kubectl create secret
# --from-literal`, a SealedSecret, or an External Secrets operator is stronger
# than a plain Secret and is worth the setup on a shared cluster.
#
# Generate the APP_KEY once, on any machine with the app checked out:
#
#     php artisan key:generate --show
#
# A key invented by hand is a broken key: Laravel's encrypter throws on the
# first encrypted value it meets, which is every session cookie. Do not reuse a
# key from a .env on a developer machine - rotating it later logs everyone out
# and invalidates anything already stored.
apiVersion: v1
kind: Secret
metadata:
  name: tracker-asset-secrets
  labels:
    app: tracker-asset
type: Opaque
stringData:
  # Only the encryption key. The database credentials live in
  # tracker-asset-db-secret below, and every workload reads DB_PASSWORD from
  # there - the same secret PostgreSQL itself is configured from. One source of
  # truth means there is nothing to keep in sync, and therefore no way for the
  # app and the database to disagree about the password.
  app_key: "base64:CHANGE_ME_generate_with_php_artisan_key:generate_show"

---
# Password for the PostgreSQL instance in postgres.yaml.
#
# A separate Secret on purpose: the database password and the app's encryption
# key have different blast radii and different lifetimes. The app key is never
# written to the database; the database password never leaves the database's
# own config. Sharing one Secret makes it easy to rotate one without the other,
# or to leak both together by accident.
apiVersion: v1
kind: Secret
metadata:
  name: tracker-asset-db-secret
  labels:
    app: tracker-asset
type: Opaque
stringData:
  # The database credentials, used by PostgreSQL in postgres.yaml AND read by
  # every Laravel workload. One Secret, one password, no chance of them drifting
  # apart.
  db_username: "tracker"
  db_password: "CHANGE_ME"