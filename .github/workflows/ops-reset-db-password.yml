name: Ops - align the database role password

# One-off recovery, not part of the deploy path.
#
# The stack was started with a .env whose DB_PASSWORD differed from the one the
# postgres data volume was initialised with. Nothing noticed for weeks because
# the app container had been running since that first start; the first real
# release after the deploy script was fixed restarted it, and the app has been
# unable to authenticate since.
#
# This sets the role password to the value the deploy .env already carries. It
# touches no table, no row and no schema - only the role's password, so the
# application config does not have to change.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RESET to confirm
        required: true
        default: ""

permissions:
  contents: read

jobs:
  reset:
    if: github.event.inputs.confirm == 'RESET'
    runs-on: [self-hosted, linux, production]
    timeout-minutes: 10
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/tracker-asset' }}
    steps:
      - name: Set the role password to the .env value
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"

          set -a
          . ./.env
          set +a

          : "${DB_USERNAME:=tracker}"
          : "${DB_DATABASE:=tracker_asset}"

          if [ -z "${DB_PASSWORD:-}" ]; then
            echo "::error::DB_PASSWORD is empty in $DEPLOY_PATH/.env"
            exit 1
          fi

          # psql does not expand :'pw' inside -c, so the value is quoted here
          # and any single quote in it is doubled the way SQL expects.
          escaped=$(printf '%s' "$DB_PASSWORD" | sed "s/'/''/g")

          docker compose -f docker-compose.prod.yml exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U "$DB_USERNAME" -d "$DB_DATABASE" \
              -c "ALTER USER \"$DB_USERNAME\" WITH PASSWORD '$escaped';"

      - name: Recreate the app so it reconnects with the aligned credentials
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps app scheduler < /dev/null

      - name: Verify
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 40 http://127.0.0.1/up || echo 000)
          echo "app /up -> ${code}"
          docker compose -f docker-compose.prod.yml logs --tail=40 app || true
          if [ "$code" != "200" ]; then
            echo "::error::app still not answering"
            exit 1
          fi