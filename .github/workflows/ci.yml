name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch supersedes the run it replaced. Without this,
# every fix-up commit queues a full matrix behind a run whose result nobody will
# read, and a force-push can leave two builds racing for the same GHCR tag.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    name: PHPUnit (sqlite)
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, gd, sqlite3, dom, curl
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test

  tests-postgres:
    runs-on: ubuntu-latest
    name: PHPUnit (postgres)
    timeout-minutes: 20

    # The production engine, not an extra safety net.
    #
    # The migrations declare foreign keys to tables that are created by later
    # migrations, which SQLite accepts and PostgreSQL rejects outright, so the
    # schema could not be built here at all until that ordering was fixed. The
    # suite also relied on SQLite handing out rowid 1 again after each rolled-back
    # test; a PostgreSQL sequence never rewinds, so any fixture that hardcoded an
    # id of 1 passed on one engine and named nothing on the other. Neither class
    # of problem is visible from SQLite alone, which is why this job exists.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, gd, pdo_pgsql, dom, curl
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: tracker_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan test

  windows-agent:
    runs-on: windows-latest
    name: Windows Agent (build + checks)
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run offline agent checks
        run: dotnet run --project agent/TrackerAgent.Tests/TrackerAgent.Tests.csproj --configuration Release

      - name: Build Windows Agent
        run: dotnet build agent/TrackerAgent/TrackerAgent.csproj --configuration Release --no-restore

  sensitive-data:
    runs-on: ubuntu-latest
    name: Sensitive data guards
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks-action resolves the pull request's commit list through the REST
      # API before it scans anything. With only `contents: read` that request is
      # rejected with 403 "Resource not accessible by integration" and the job
      # fails before the first secret is ever examined - a red build that says
      # nothing about the diff.
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check tracked paths
        run: bash scripts/check-sensitive-paths.sh

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  pint:
    runs-on: ubuntu-latest
    name: Code style (Pint)
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test

  # PRD §47: composer install -> tests -> build Docker image -> push image.
  #
  # It lives in this workflow instead of a deploy workflow because the order is
  # the point. A workflow can only `needs` jobs in the same run, so the chain in
  # §47 is enforced by the file rather than by convention: a commit that fails
  # either database engine, the Windows Agent checks, the sensitive-data guards,
  # or the style gate never gets an image. An image nobody has tested should not
  # exist under a tag someone can pull.
  #
  # The deploy arrow after this lives in deploy.yml, on purpose. It fires on
  # workflow_run once this workflow finishes successfully on main, so the
  # separation is real: this file proves and publishes a commit, and that one
  # only ever pulls the image this job just pushed - addressed by the same
  # commit hash. What this job publishes is the proof that this commit builds,
  # tagged by the commit that makes it a known quantity.
  image:
    runs-on: ubuntu-latest
    name: Docker image (GHCR)
    timeout-minutes: 30
    needs: [tests, tests-postgres, windows-agent, sensitive-data, pint]
    # Enough to push, and nothing more. `packages: write` is what lets the job
    # publish with the token every run already carries - there is no repository
    # secret here to create, rotate, or watch expire at the wrong moment.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GHCR takes lowercase image names only, and github.repository is
      # "masmbull/TRACKER-ASSET". Pushing it as written fails with "invalid
      # reference format" - a repository name that reads correctly in every
      # other context is the one thing that can kill this job before the build
      # starts, so it is lowered here rather than remembered.
      - name: Resolve image name
        id: image
        run: |
          echo "name=ghcr.io/$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        # Publishing happens only on push. The trigger today already limits that
        # to main, but the ref is named so this stays true if a second branch is
        # ever added to `on:` - and a pull_request run is handed a token without
        # write scope, so logging in there would fail for a reason that has
        # nothing to do with the diff. The build itself still runs, which is why
        # login is gated and the job is not.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Same expression as above: pull requests build but do not publish.
          # A Dockerfile that no longer builds is then caught before merge, and
          # no half-reviewed branch puts a tag on the registry.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # The commit hash is the real tag, for the same reason deploy.yml
          # deploys by commit: it changes exactly when the code does, which is what makes
          # "which build is running?" answerable. `latest` rides along for a
          # human reading the package page; nothing should deploy it.
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          # Layer cache between runs. Without it every push pays for composer
          # install and npm ci again - the two slowest stages in the Dockerfile,
          # and neither depends on anything a given commit changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max
