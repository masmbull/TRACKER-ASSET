name: Deploy

# CI > DEPLOY, split on purpose.
#
# This workflow never builds or tests anything. It waits for ci.yml to finish on
# main, then deploys the exact image CI published for that commit - so a commit
# that fails either test engine or Pint can never reach the server: the tag this
# pulls does not exist unless the image job ran, and that job needs all three
# gates. The two files stay separate because the jobs are separate concerns: CI
# answers "does this commit work", Deploy answers "put it in front of users".
#
# Deploy runs on a self-hosted runner installed on the production server. The
# runner polls GitHub outbound over HTTPS, so the server needs no inbound SSH
# port, no firewall exception, and no SSH key secret. See docs/deployment.md.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Escape hatch: redeploy the current main without pushing a new commit.
  workflow_dispatch:

permissions:
  contents: read
  # Enough to log the server in to GHCR and pull the image, and nothing more.
  # No personal access token to create or watch expire.
  packages: read

# One deploy at a time, never cancelled mid-flight. Two overlapping runs would
# race the same compose project and could leave the stack half-replaced.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    # The self-hosted runner lives on the office Ubuntu server, next to the
    # Docker stack. GitHub-hosted runners cannot reach that server's SSH port,
    # which is why this job used to time out.
    runs-on: [self-hosted, linux, production]
    timeout-minutes: 20
    # Never run code from a non-main ref on the production runner. workflow_run
    # must be a successful push to main; manual redeploys must also target main.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')

    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/tracker-asset' }}

    steps:
      - name: Checkout the deployed commit
        uses: actions/checkout@v4
        with:
          # For workflow_run this is the commit CI built, not whatever main points
          # at now. The compose file has to match the image being deployed.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve release
        id: release
        run: |
          sha='${{ github.event.workflow_run.head_sha || github.sha }}'
          image="ghcr.io/$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Sync compose files to the deploy path
        run: |
          set -euo pipefail

          if [ ! -w "$DEPLOY_PATH" ]; then
            echo "::error::${DEPLOY_PATH} is not writable by $(id -un). Fix ownership on the server; see docs/deployment.md."
            exit 1
          fi

          if [ ! -f "$DEPLOY_PATH/.env" ]; then
            echo "::error::${DEPLOY_PATH}/.env is missing. Create it on the server; see docs/deployment.md."
            exit 1
          fi

          mkdir -p "$DEPLOY_PATH/docker"
          cp docker-compose.prod.yml "$DEPLOY_PATH/docker-compose.prod.yml"
          cp docker/nginx.conf "$DEPLOY_PATH/docker/nginx.conf"

      - name: Log in to GHCR
        run: |
          # The image is private, so the pull needs credentials. The run's own
          # token is used (see `permissions: packages: read` above) and piped
          # through stdin so it never appears in a process list. It is short
          # lived, but it only has to survive this one pull.
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' | \
            docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Deploy
        env:
          IMAGE_TAG: ${{ steps.release.outputs.sha }}
          IMAGE_REPOSITORY: ${{ steps.release.outputs.image }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"

          # These commands used to live in a `bash -s <<'REMOTE'` heredoc.
          # `docker compose run` attaches the container to the script's stdin,
          # so the container ate the rest of the heredoc: `up -d` never ran, the
          # job still exited 0, and every deploy reported success without
          # shipping anything. The server kept serving the image from the day
          # the stack was first started. Running the commands directly, with
          # stdin closed, is the fix - and the guard at the bottom makes a
          # silent no-op deploy fail loudly instead.
          docker compose -f docker-compose.prod.yml pull < /dev/null

          # Re-copy the compiled assets out of the new image before nginx can
          # serve them, so a build never serves the previous release's CSS/JS.
          docker compose -f docker-compose.prod.yml run --rm --no-deps assets < /dev/null

          # The app container's entrypoint runs the migrations as it starts.
          # This recreates app/scheduler/nginx because the image string changed,
          # which is what makes a deploy actually deploy.
          docker compose -f docker-compose.prod.yml up -d --remove-orphans < /dev/null

          docker compose -f docker-compose.prod.yml ps

          # Prove the release is the one now serving traffic. Without this a
          # compose file that never recreates the container looks identical to a
          # successful deploy.
          running=$(docker compose -f docker-compose.prod.yml ps -q app)
          if [ -z "$running" ]; then
            echo "::error::the app container is not running after up -d"
            exit 1
          fi

          actual=$(docker inspect --format '{{.Config.Image}}' "$running")
          if [ "$actual" != "${IMAGE_REPOSITORY}:${IMAGE_TAG}" ]; then
            echo "::error::app is running ${actual}, expected ${IMAGE_REPOSITORY}:${IMAGE_TAG}"
            exit 1
          fi

          # The image running is only half the story: a container can be up while
          # php-fpm is still behind its entrypoint (migrations, then seeders on
          # a fresh release), which nginx answers with 502. Poll instead of
          # sampling once, and print the logs either way so a bad release is
          # diagnosable from this log instead of by hand.
          code=000
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1/up || echo 000)
            [ "$code" = "200" ] && break
            sleep 3
          done
          echo "app /up -> ${code}"

          docker compose -f docker-compose.prod.yml logs --tail=150 app || true

          if [ "$code" != "200" ]; then
            echo "::error::the app answered ${code} after the release, not 200"
            exit 1
          fi

          # Reclaim what this release replaced, but nothing from the last week,
          # so a same-day rollback does not have to re-pull an image.
          docker image prune -f --filter 'until=168h' >/dev/null

          echo "Deployed ${IMAGE_REPOSITORY}:${IMAGE_TAG}"