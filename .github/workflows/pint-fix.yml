name: Pint fix

# Manual style fixer — useful when the local machine cannot run PHP/Pint.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pint:
    runs-on: ubuntu-latest
    name: Laravel Pint (auto-fix)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pint (fix mode)
        run: vendor/bin/pint

      - name: Commit style fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: pint auto-fix"
